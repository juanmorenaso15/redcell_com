spring:
  application:
    name: redcell-soat
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 15MB

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:no-reply@redcell.uk}
    password: ${MAIL_PASSWORD:default}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

resend:
  api-url: ${RESEND_API_URL:https://api.resend.com/emails}
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:RedCell SOAT <onboarding@resend.dev>}

jwt:
  secret: ${JWT_SECRET}

whatsapp:
  service:
    url: ${WHATSAPP_SERVICE_URL:http://localhost:8095}
  default-country-code: ${WHATSAPP_DEFAULT_COUNTRY_CODE:57}

server:
  port: ${PORT:8080}